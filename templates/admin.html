<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f6fb;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:240px;
height:100vh;
background:#4F46E5;
color:white;
}

.sidebar h2{
text-align:center;
padding:25px;
margin:0;
border-bottom:1px solid rgba(255,255,255,.2);
}

.sidebar a{
display:block;
padding:18px 25px;
text-decoration:none;
color:white;
font-size:17px;
transition:.3s;
}

.sidebar a:hover{
background:white;
color:#4F46E5;
}

.main{
margin-left:240px;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:25px;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
margin:0;
color:#555;
}

.card h1{
margin-top:15px;
color:#4F46E5;
}

table{
width:100%;
margin-top:40px;
border-collapse:collapse;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table th,
table td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

table th{
background:#4F46E5;
color:white;
}

.btn{
padding:8px 18px;
border:none;
background:#4F46E5;
color:white;
cursor:pointer;
border-radius:5px;
}

</style>

</head>
<body>

<div class="sidebar">

<h2>ADMIN</h2>

<a href="/admin">Dashboard</a>
<a href="/registered_students">Registered Students</a>
<a href="#">Categories</a>
<a href="/add_event">Add Event</a>
<a href="#">Reports</a>
<a href="/logout">Logout</a>

</div>

<div class="main">

<h1>College Event Management System</h1>


<table>

<tr>

<th>S.NO</th>
<th>Event</th>
<th>Date</th>
<th>Seats</th>
<th>Action</th>

</tr>

{% for event in events %}

<tr>

<td>{{ loop.index }}</td>

<td>{{ event.event_name }}</td>

<td>{{ event.date }}</td>

<td>{{ event.seats }}</td>

<td>

<a href="/edit_event/{{ event._id }}">
<button class="btn">Edit</button>
</a>

<a href="/delete_event/{{ event._id }}"
onclick="return confirm('Delete this event?')">

<button class="btn" style="background:red;margin-left:8px">
Delete
</button>

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
