<!DOCTYPE html>
<html>
<head>

<title>Available Events</title>

<style>

body{
font-family:Arial;
background:#f4f6fb;
margin:0;
}

.container{
width:90%;
margin:40px auto;
}

h2{
text-align:center;
color:#4F46E5;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

th,td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

th{
background:#4F46E5;
color:white;
}

.btn{

background:#4F46E5;
color:white;
padding:8px 18px;
border:none;
border-radius:5px;
cursor:pointer;

}

.back{

text-decoration:none;
background:#4F46E5;
color:white;
padding:10px 18px;
border-radius:5px;

}

</style>

</head>

<body>

<div class="container">

<h2>Available Events</h2>

<br>

<a class="back" href="/student_dashboard">
⬅ Back
</a>

<br><br>

<table>

<tr>

<th>ID</th>
<th>Event Name</th>
<th>Category</th>
<th>Date</th>
<th>Venue</th>
<th>Action</th>

</tr>

{% for event in events %}

<tr>

<td>{{ loop.index }}</td>

<td>{{ event.event_name }}</td>

<td>{{ event.category }}</td>

<td>{{ event.date }}</td>

<td>{{ event.venue }}</td>


<td>

<a href="/register_event/{{ event._id }}">

<button class="btn">

Register

</button>

</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
