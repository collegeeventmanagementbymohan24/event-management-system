<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4F46E5,#7C3AED);
}

.box{
width:400px;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.box h2{
text-align:center;
color:#4F46E5;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#4F46E5;
color:white;
border:none;
border-radius:8px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#372FCF;
}

</style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<form>

<input type="email" placeholder="Enter Registered Email" required>

<input type="password" placeholder="New Password" required>

<input type="password" placeholder="Confirm Password" required>

<button type="submit">
Update Password
</button>

</form>

</div>

</body>
</html>
