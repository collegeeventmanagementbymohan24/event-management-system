<!DOCTYPE html>
<html>
<head>
    <title>Edit Event</title>

    <style>

    body{
        font-family:Arial;
        background:#f4f6fb;
    }

    .container{
        width:500px;
        margin:50px auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 5px 15px rgba(0,0,0,.2);
    }

    h2{
        text-align:center;
        color:#4F46E5;
    }

    input, textarea{
        width:100%;
        padding:12px;
        margin-top:10px;
        margin-bottom:15px;
    }

    button{
        width:100%;
        padding:12px;
        background:#4F46E5;
        color:white;
        border:none;
        cursor:pointer;
        border-radius:5px;
    }

    </style>

</head>

<body>

<div class="container">

<h2>Edit Event</h2>

<form method="POST">

<input
type="text"
name="event_name"
value="{{ event.event_name }}"
required>

<input
type="text"
name="category"
value="{{ event.category }}"
required>

<input
type="date"
name="date"
value="{{ event.date }}"
required>

<input
type="text"
name="venue"
value="{{ event.venue }}"
required>

<input
type="number"
name="seats"
value="{{ event.seats }}"
required>

<textarea
name="description">{{ event.description }}</textarea>

<button type="submit">

Update Event

</button>

</form>

</div>

</body>
</html>
