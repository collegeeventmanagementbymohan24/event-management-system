<!DOCTYPE html>
<html>
<head>
<title>Registered Students</title>

<style>

body{
font-family:Arial;
background:#f4f6fb;
margin:0;
}

.container{
width:90%;
margin:40px auto;
}

h2{
text-align:center;
color:#4F46E5;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

th,td{
padding:15px;
text-align:center;
border-bottom:1px solid #ddd;
}

th{
background:#4F46E5;
color:white;
}

a{
text-decoration:none;
background:#4F46E5;
color:white;
padding:10px 18px;
border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Registered Students</h2>

<br>

<a href="/admin">⬅ Back to Dashboard</a>

<br><br>

<table>

<tr>
<tr>

<th>ID</th>
<th>Name</th>
<th>Roll No</th>
<th>Branch</th>
<th>Year</th>
<th>Gender</th>
<th>Email</th>

</tr>
    </tr>

 {% for student in students %}

     <tr>

<tr>

<td>{{ loop.index }}</td>
<td>{{ student.name }}</td>
<td>{{ student.roll_no }}</td>
<td>{{ student.branch }}</td>
<td>{{ student.year }}</td>
<td>{{ student.gender }}</td>
<td>{{ student.email }}</td>

<td>
    <a href="/delete_student/{{ student._id }}"
       onclick="return confirm('Delete this student?')">
        <button style="background:red;color:white;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;">
            Delete
        </button>
    </a>
</td>
</tr>

</tr>

  {% endfor %}

  </table>

 </div>

 </body>
 </html>
