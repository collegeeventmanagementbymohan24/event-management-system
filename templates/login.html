<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4F46E5,#7C3AED);
}

.login-box{

width:400px;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);

}

.login-box h1{

text-align:center;
margin-bottom:30px;
color:#4F46E5;

}

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;
margin-bottom:8px;
font-weight:bold;

}

.input-group input{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;

}

button{

width:100%;
padding:14px;
border:none;
background:#4F46E5;
color:white;
font-size:18px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#372FCF;

}

.note{

margin-top:20px;
text-align:center;
color:#777;
font-size:14px;

}

</style>

</head>

<body>

<div class="login-box">

<h1>Campus Events Login</h1>

<form method="POST" action="/login">

<div class="input-group">

<label>Email</label>

<input
type="email"
name="email"
id="email"
placeholder="Enter Email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
name="password"
id="password"
placeholder="Enter Password"
required>

</div>

<button type="submit">

Login

</button>
<div style="text-align:right; margin-top:12px;">
    <a href="/forgot_password"
       style="color:#4F46E5; text-decoration:none; font-weight:bold;">
        Forgot Password?
    </a>
</div>

</form>

<p class="note">

Student & Admin Login

</p>

</div>

</body>
</html>
